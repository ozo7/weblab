<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>webviewer</title>
  <link rel="stylesheet" href="/styles/all.css">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--mint-body-bg, var(--mint-surface, #e7efe8));
      color: var(--mint-text, #17301f);
      font: 400 15px/1.4 "Trebuchet MS", "Segoe UI", sans-serif;
    }

    #appViewportHost {
      border: 1px solid var(--mint-border-soft, #bfcfc3);
      border-radius: 12px;
      background: var(--mint-host-bg, var(--mint-layer, #f9fcf9));
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="appViewportHost" aria-label="App viewport"></div>
  <script type="module" src="/app/app.js"></script>
</body>
</html>
